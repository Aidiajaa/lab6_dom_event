<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktikum DOM dan Event</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
    <h1 id="judul">Latihan DOM</h1>
    <p id="pesan">Belum ada tindakan.</p>
    <p id="teksGaya">Gaya.</p>
    <button id="tombolAksi" type="button">Klik Saya</button>
    <button id="tombolGaya" type="button">Ubah Gaya</button>

    <label for="namaInput">Nama:</label>
    <input type="text" id="namaInput" maxlength="40">
    <p>Jumlah karakter: <span id="jumlahKarakter">0</span></p>

    <form id="formPendaftaran" novalidate>
        <label for="nama">Nama lengkap</label>
        <input id="nama" name="nama" type="text">
        <label for="email">Email</label>
        <input id="email" name="email" type="email">
        <label for="usia">Usia</label>
        <input id="usia" name="usia" type="number" min="17" max="100">
        <button type="submit">Daftar</button>
    </form>
    <p id="pesanForm" aria-live="polite"></p>

    <section>
        <h2>Daftar Tugas</h2>
        <label for="inputTugas">Tugas baru</label>
        <input id="inputTugas" type="text">
        <button id="tambahTugas" type="button">Tambah</button>
        <p id="pesanTugas" aria-live="polite"></p>
        <ul id="daftarTugas"></ul>
    </section>

    <label for="sesiWorkshop">Pilih Sesi Workshop:</label>
    <select id="sesiWorkshop">
        <option value="">-- Pilih Sesi --</option>
        <option value="Web Development Basic">Web Development Basic</option>
        <option value="Advanced JavaScript & DOM">Advanced JavaScript & DOM</option>
        <option value="UI/UX Design for Web">UI/UX Design for Web</option>
    </select>
    <p id="infoSesi">Sesi yang dipilih: Belum memilih</p>

    <p id="paragrafTampil">Ini adalah paragraf yang dapat disembunyikan atau ditampilkan.</p>
    <button id="tombolSembunyi" type="button">Sembunyikan/Tampilkan Paragraf</button>
</body>
</html>
