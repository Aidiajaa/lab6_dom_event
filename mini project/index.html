<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Workshop</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <h2>Form Pendaftaran Workshop</h2>
        
        <form id="formWorkshop" novalidate>
            <!-- Input Nama -->
            <div class="form-group">
                <label for="nama">Nama Lengkap:</label>
                <input type="text" id="nama" name="nama" maxlength="40">
                <p class="info-karakter">Jumlah karakter nama: <span id="jumlahKarakter">0</span>/40</p>
            </div>

            <!-- Input Email -->
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email">
            </div>

            <!-- Dropdown Sesi Workshop -->
            <div class="form-group">
                <label for="sesi">Pilihan Sesi Workshop:</label>
                <select id="sesi" name="sesi">
                    <option value="">-- Pilih Sesi --</option>
                    <option value="Web Development Basic">Web Development Basic</option>
                    <option value="Advanced JavaScript & DOM">Advanced JavaScript & DOM</option>
                    <option value="UI/UX Design for Web">UI/UX Design for Web</option>
                </select>
                <p id="infoSesi" class="info-sesi">Sesi yang dipilih: Belum memilih</p>
            </div>

            <!-- Pesan Kesalahan / Sukses -->
            <p id="pesanForm" aria-live="polite"></p>

            <!-- Tombol Aksi -->
            <div class="button-group">
                <button type="submit" id="btnDaftar">Daftar</button>
                <button type="button" id="btnReset">Reset Input</button>
            </div>
        </form>
    </div>
</body>
</html>
